name: Ajouter des réalisations au portfolio

on:
  push:
    branches: [main]
    paths: ["ajouter/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ajouter-realisations
  cancel-in-progress: false

jobs:
  ajouter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les images et mettre à jour le site
        run: |
          pip install --quiet pillow
          python scripts/ajouter.py || echo "ATTENTION=1" >> "$GITHUB_ENV"

      - name: Enregistrer
        run: |
          git config user.name "LS DESIGN (mise à jour auto)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Nouvelles réalisations ajoutées au portfolio"
          git pull --rebase origin main
          git push

      - name: Signaler un problème
        if: env.ATTENTION == '1'
        run: |
          echo "Certains dossiers de ajouter/ ne correspondent à aucun projet. Voir l'étape précédente."
          exit 1
